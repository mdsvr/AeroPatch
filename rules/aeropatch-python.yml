# AeroPatch Opengrep ruleset (doc 06 §8). Our own rules, shipped under this repo's license.
# Messages state facts; they are not instructions to a model.
rules:
  - id: aeropatch.python.sqli-string-query
    languages: [python]
    severity: ERROR
    message: User input reaches SQL string formatting.
    metadata: {cwe: "CWE-89: SQL injection"}
    pattern-either:
      - pattern: $C.execute(f"...", ...)
      - pattern: $C.execute("..." % $X, ...)
      - pattern: $C.execute("...".format(...), ...)
      - pattern: $C.execute("..." + $X, ...)

  - id: aeropatch.python.subprocess-shell
    languages: [python]
    severity: ERROR
    message: A command string is run through the shell.
    metadata: {cwe: "CWE-78: OS command injection"}
    pattern-either:
      - pattern: subprocess.$F(..., shell=True, ...)
      - pattern: os.system(...)
      - pattern: os.popen(...)

  - id: aeropatch.python.path-traversal-open
    languages: [python]
    severity: ERROR
    message: A caller-supplied name is joined onto a directory and opened without a containment check.
    metadata: {cwe: "CWE-22: Path traversal"}
    patterns:
      - pattern-inside: |
          def $F(..., $NAME, ...):
            ...
      - pattern-either:
          - pattern: open(os.path.join($BASE, $NAME), ...)
          - patterns:
              - pattern-inside: |
                  $P = os.path.join($BASE, $NAME)
                  ...
              - pattern: open($P, ...)

  - id: aeropatch.python.unsafe-deserialization
    languages: [python]
    severity: ERROR
    message: Untrusted bytes are deserialized with pickle or unsafe YAML loading.
    metadata: {cwe: "CWE-502: Unsafe deserialization"}
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
      - patterns:
          - pattern: yaml.load(...)
          - pattern-not: yaml.load(..., Loader=yaml.SafeLoader, ...)

  - id: aeropatch.python.ssrf-unvalidated-fetch
    languages: [python]
    severity: ERROR
    message: User-supplied URL is fetched without checking the resolved address.
    metadata: {cwe: "CWE-918: Server-side request forgery"}
    patterns:
      - pattern-inside: |
          def $F(..., $URL, ...):
            ...
      - pattern-inside: |
          $PARTS = urlparse($URL)
          ...
      - pattern-not-inside: |
          $A = ipaddress.ip_address(...)
          ...
      - pattern-either:
          - pattern: $FETCH($URL)
          - pattern: $M.$FETCH($URL, ...)
      - metavariable-regex:
          metavariable: $FETCH
          regex: ^(fetch|get|post|urlopen|request)$

  - id: aeropatch.python.html-fstring-unescaped
    languages: [python]
    severity: WARNING
    message: User-supplied values are interpolated into HTML without escaping.
    metadata: {cwe: "CWE-79: Cross-site scripting"}
    patterns:
      - pattern-inside: |
          def $F(..., $X, ...):
            ...
      - pattern-either:
          - pattern-regex: f'[^'\n]*<[a-zA-Z][^'\n]*\{[a-zA-Z_][a-zA-Z0-9_]*\}
          - pattern-regex: f"[^"\n]*<[a-zA-Z][^"\n]*\{[a-zA-Z_][a-zA-Z0-9_]*\}

  - id: aeropatch.python.open-redirect
    languages: [python]
    severity: WARNING
    message: A redirect target from the request is returned without validation.
    metadata: {cwe: "CWE-601: Open redirect"}
    patterns:
      - pattern-inside: |
          def $F(..., $NEXT, ...):
            ...
      - pattern-not-inside: |
          $P = urlparse($NEXT)
          ...
      - pattern: return $NEXT
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*redirect.*
      - metavariable-regex:
          metavariable: $NEXT
          regex: (?i).*(next|url|target|dest).*

  - id: aeropatch.python.redos-nested-quantifier
    languages: [python]
    severity: WARNING
    message: Regular expression with a nested quantifier can backtrack exponentially.
    metadata: {cwe: "CWE-1333: Inefficient regular expression"}
    patterns:
      - pattern-either:
          - pattern: re.compile("$R", ...)
          - pattern: re.match("$R", ...)
          - pattern: re.search("$R", ...)
          - pattern: re.fullmatch("$R", ...)
      - metavariable-regex:
          metavariable: $R
          regex: .*\([^()]*[+*]\)[+*{].*

  - id: aeropatch.python.weak-password-hash
    languages: [python]
    severity: ERROR
    message: A fast unsalted digest is used for password storage.
    metadata: {cwe: "CWE-328: Weak hash"}
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*passw.*
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.sha256(...)

  - id: aeropatch.python.exception-in-response
    languages: [python]
    severity: WARNING
    message: Exception details are returned to the client.
    metadata: {cwe: "CWE-209: Information exposure through an error message"}
    patterns:
      - pattern-inside: |
          try:
            ...
          except $T as $E:
            ...
      - pattern: return <... $E ...>

  - id: aeropatch.python.tar-extract-unfiltered
    languages: [python]
    severity: ERROR
    message: Archive entries are extracted without checking that their paths stay inside the destination.
    metadata: {cwe: "CWE-22: Path traversal"}
    patterns:
      - pattern-either:
          - pattern: $TAR.extractall(...)
          - pattern: $TAR.extract(...)
      - pattern-not: $TAR.extractall(..., filter=$FILTER, ...)
      - pattern-not: $TAR.extract(..., filter=$FILTER, ...)

  - id: aeropatch.python.xxe-external-entities
    languages: [python]
    severity: ERROR
    message: The XML parser is set to resolve external entities.
    metadata: {cwe: "CWE-611: XML external entity reference"}
    pattern-either:
      - pattern: $P.setFeature(xml.sax.handler.feature_external_ges, True)
      - pattern: $P.setFeature(xml.sax.handler.feature_external_pes, True)
      - pattern: $P.setFeature(feature_external_ges, True)
      - pattern: $P.setFeature(feature_external_pes, True)

  - id: aeropatch.python.hardcoded-credential
    languages: [python]
    severity: ERROR
    message: A credential is assigned from a string literal in the source.
    metadata: {cwe: "CWE-798: Hard-coded credentials"}
    patterns:
      - pattern: $NAME = "..."
      - pattern-not: $NAME = ""
      - metavariable-regex:
          metavariable: $NAME
          regex: (?i)^\w*(password|passwd|secret|api_?key|token)\w*$

  - id: aeropatch.python.csrf-missing-check
    languages: [python]
    severity: WARNING
    message: A state-changing POST view does not check the CSRF token.
    metadata: {cwe: "CWE-352: Cross-site request forgery"}
    patterns:
      - pattern: |
          def $VIEW($REQUEST, $SESSION, ...):
              ...
              if $REQUEST["method"] != "POST":
                  ...
              ...
      - pattern-not-regex: (?i)csrf

  - id: aeropatch.python.csrf-check-skippable
    languages: [python]
    severity: WARNING
    message: The CSRF token is only checked when the request sends one.
    metadata: {cwe: "CWE-352: Cross-site request forgery"}
    patterns:
      - pattern: |
          if $KEY in $FORM and $REST:
              ...
      - metavariable-regex:
          metavariable: $KEY
          regex: (?i).*csrf.*

  - id: aeropatch.python.unchecked-quantity
    languages: [python]
    severity: WARNING
    message: A quantity parsed from request input is used without a range check.
    metadata: {cwe: "CWE-20: Improper input validation"}
    patterns:
      - pattern: $X = int($SRC)
      - metavariable-regex:
          metavariable: $SRC
          regex: (?i)^\w*(quantity|qty|amount)\w*$
      - pattern-not-inside: |
          $X = int($SRC)
          ...
          if <... $X ...>:
              ...

  - id: aeropatch.python.insecure-random-secret
    languages: [python]
    severity: ERROR
    message: A security code is generated with the non-cryptographic random module.
    metadata: {cwe: "CWE-338: Cryptographically weak PRNG"}
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(token|secret|passw|otp|nonce|_code|_key).*
      - pattern: random.$FN(...)
      - metavariable-regex:
          metavariable: $FN
          regex: ^(Random|choice|choices|randint|random|randrange|getrandbits|sample|shuffle)$

  - id: aeropatch.python.weak-integrity-digest
    languages: [python]
    severity: WARNING
    message: A collision-prone digest (MD5 or SHA-1) is used to check data integrity.
    metadata: {cwe: "CWE-327: Broken or risky cryptographic algorithm"}
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(fingerprint|checksum|digest|etag|integrity).*
      - pattern-either:
          - pattern: hashlib.md5(...)
          - pattern: hashlib.sha1(...)
          - pattern: hashlib.new("md5", ...)
          - pattern: hashlib.new("sha1", ...)

  - id: aeropatch.python.keyed-hash-without-hmac
    languages: [python]
    severity: ERROR
    message: A signature is a plain hash of the key joined to the message, not an HMAC.
    metadata: {cwe: "CWE-327: Broken or risky cryptographic algorithm"}
    patterns:
      - pattern-inside: |
          def $F(...):
            ...
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(sign|mac).*
      - pattern-either:
          - pattern: hashlib.$H($KEY + $MSG, ...)
          - pattern: hashlib.new($ALG, $KEY + $MSG, ...)

  - id: aeropatch.python.dynamic-import-deserialization
    languages: [python]
    severity: ERROR
    message: A name taken from the data being decoded is imported and called.
    metadata: {cwe: "CWE-502: Unsafe deserialization"}
    pattern-either:
      - pattern: getattr(importlib.import_module($M), $N)
      - pattern: getattr(__import__($M), $N)

  - id: aeropatch.python.html-escape-misses-quotes
    languages: [python]
    severity: WARNING
    message: A hand-written HTML escape leaves quotes unescaped.
    metadata: {cwe: "CWE-79: Cross-site scripting"}
    patterns:
      - pattern: |
          def $F(...):
              ...
              return <... $V.replace("<", "&lt;") ...>
      - pattern-not-regex: (&quot;|&#34;|&#x22;)

  - id: aeropatch.python.url-prefix-allowlist
    languages: [python]
    severity: ERROR
    message: A URL is allowed by its string prefix; its host is never parsed.
    metadata: {cwe: "CWE-918: Server-side request forgery"}
    patterns:
      - pattern-inside: |
          def $F(..., $URL, ...):
            ...
      - metavariable-regex:
          metavariable: $F
          regex: (?i).*(fetch|download|proxy).*
      - pattern: $URL.startswith(...)
