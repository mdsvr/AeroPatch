# `test`: lint and the tests that need no Docker sandbox and no model server.
# `sandbox`: builds the sandbox base image and runs the tests marked `docker` (the sandbox's
# hardening, the loop through it, the MCP tools that use it) on native Linux Docker.
name: CI

on:
  push:
    branches: [main, feat/week3-d15-data]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run pytest -m "not docker" -q

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run aeropatch build-base
      - run: uv run pytest -m docker -q
