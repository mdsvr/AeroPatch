<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 640" width="1040" height="640" role="img" aria-labelledby="t d">
  <title id="t">AeroPatch local page: how it fits together</title>
  <desc id="d">Inside the laptop, the browser talks only to a local server on 127.0.0.1, which runs one job at a time: the check, then the fix loop for the problems the user ticks. The fix loop asks a local model for an edit, checks it with 8 safety gates and runs the user's tests in a Docker sandbox with the network off. Four dashed arrows leave the laptop: downloading a GitHub link, the optional osv.dev lookup, a hand-off to another model after a preview, and a request the user copies into another AI tool.</desc>
  <style>
    .bg { fill: #ffffff; }
    .zone { fill: #f6f8f7; stroke: #8a9690; stroke-width: 1.3; stroke-dasharray: 7 5; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.3; }
    .box.loop { stroke: #9a3412; stroke-width: 2; }
    .box.out { fill: #e8edfb; stroke: #2446c4; }
    .t1 { font: 600 14px -apple-system, "Segoe UI", system-ui, sans-serif; fill: #1f2328; }
    .t2 { font: 12px ui-monospace, "Cascadia Mono", Consolas, monospace; fill: #56645d; }
    .zl { font: 700 12px -apple-system, "Segoe UI", system-ui, sans-serif; fill: #56645d; letter-spacing: .06em; }
    .lbl { font: 12px ui-monospace, "Cascadia Mono", Consolas, monospace; fill: #1f2328; paint-order: stroke; stroke: #f6f8f7; stroke-width: 5px; stroke-linejoin: round; }
    .lbl.out { fill: #2446c4; stroke: #ffffff; }
    .lbl.edge-out { fill: #2446c4; }
    .edge { fill: none; stroke: #1f2328; stroke-width: 1.5; }
    .edge.out { stroke: #2446c4; stroke-dasharray: 6 4; }
    .head { fill: #1f2328; } .head.out { fill: #2446c4; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0d1117; }
      .zone { fill: #151b23; stroke: #6e7a74; }
      .box { fill: #0d1117; stroke: #d1d9e0; }
      .box.loop { stroke: #fdba74; }
      .box.out { fill: #1c2446; stroke: #93a9ff; }
      .t1 { fill: #e6edf3; } .t2 { fill: #9ba8a1; } .zl { fill: #9ba8a1; }
      .lbl { fill: #e6edf3; stroke: #151b23; }
      .lbl.out { fill: #93a9ff; stroke: #0d1117; } .lbl.edge-out { fill: #93a9ff; }
      .edge { stroke: #d1d9e0; } .edge.out { stroke: #93a9ff; }
      .head { fill: #d1d9e0; } .head.out { fill: #93a9ff; }
    }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head" d="M0,0 L10,5 L0,10 z"/></marker>
    <marker id="aro" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="head out" d="M0,0 L10,5 L0,10 z"/></marker>
  </defs>

  <rect class="bg" x="0" y="0" width="1040" height="640" rx="12"/>
  <rect class="zone" x="20" y="44" width="760" height="526" rx="14"/>
  <text class="zl" x="38" y="70">YOUR LAPTOP · ONLY 127.0.0.1 LISTENS</text>
  <text class="zl" x="930" y="70" text-anchor="middle">OUTSIDE</text>

  <!-- row 1 -->
  <rect class="box" x="40" y="90" width="160" height="62" rx="8"/>
  <text class="t1" x="120" y="117" text-anchor="middle">Browser</text>
  <text class="t2" x="120" y="136" text-anchor="middle">ui.html</text>
  <rect class="box" x="300" y="90" width="180" height="62" rx="8"/>
  <text class="t1" x="390" y="117" text-anchor="middle">Local server</text>
  <text class="t2" x="390" y="136" text-anchor="middle">ui.py · launch token</text>
  <rect class="box" x="580" y="90" width="180" height="62" rx="8"/>
  <text class="t1" x="670" y="117" text-anchor="middle">Downloaded copy</text>
  <text class="t2" x="670" y="136" text-anchor="middle">runs/ui-clones/</text>
  <rect class="box out" x="850" y="90" width="170" height="62" rx="8"/>
  <text class="t1" x="935" y="117" text-anchor="middle">GitHub</text>
  <text class="t2" x="935" y="136" text-anchor="middle">public repos</text>

  <!-- row 2 -->
  <rect class="box" x="300" y="222" width="180" height="62" rx="8"/>
  <text class="t1" x="390" y="249" text-anchor="middle">Job queue</text>
  <text class="t2" x="390" y="268" text-anchor="middle">one job at a time</text>
  <rect class="box" x="580" y="222" width="180" height="62" rx="8"/>
  <text class="t1" x="670" y="249" text-anchor="middle">check_folder()</text>
  <text class="t2" x="670" y="268" text-anchor="middle">scan · sort · cards</text>
  <rect class="box out" x="850" y="222" width="170" height="62" rx="8"/>
  <text class="t1" x="935" y="249" text-anchor="middle">osv.dev</text>
  <text class="t2" x="935" y="268" text-anchor="middle">package advisories</text>

  <!-- row 3 -->
  <rect class="box loop" x="300" y="354" width="180" height="62" rx="8"/>
  <text class="t1" x="390" y="381" text-anchor="middle">Fix loop</text>
  <text class="t2" x="390" y="400" text-anchor="middle">3 tries · 8 safety gates</text>
  <rect class="box" x="580" y="354" width="180" height="62" rx="8"/>
  <text class="t1" x="670" y="381" text-anchor="middle">Local models</text>
  <text class="t2" x="670" y="400" text-anchor="middle">Ollama qwen3.5:4b · GPU</text>
  <rect class="box out" x="850" y="354" width="170" height="62" rx="8"/>
  <text class="t1" x="935" y="381" text-anchor="middle">Other models</text>
  <text class="t2" x="935" y="400" text-anchor="middle">Claude Code · APIs</text>

  <!-- row 4 -->
  <rect class="box" x="300" y="486" width="180" height="62" rx="8"/>
  <text class="t1" x="390" y="513" text-anchor="middle">Sandbox</text>
  <text class="t2" x="390" y="532" text-anchor="middle">Docker · network off</text>
  <rect class="box out" x="850" y="486" width="170" height="62" rx="8"/>
  <text class="t1" x="935" y="513" text-anchor="middle">Any AI chat</text>
  <text class="t2" x="935" y="532" text-anchor="middle">ChatGPT, Gemini, …</text>

  <!-- browser <-> server -->
  <line class="edge" x1="200" y1="110" x2="298" y2="110" marker-end="url(#ar)"/>
  <text class="lbl" x="250" y="102" text-anchor="middle">your clicks</text>
  <line class="edge" x1="300" y1="134" x2="202" y2="134" marker-end="url(#ar)"/>
  <text class="lbl" x="250" y="172" text-anchor="middle">live events</text>

  <!-- server <-> queue -->
  <line class="edge" x1="365" y1="152" x2="365" y2="220" marker-end="url(#ar)"/>
  <text class="lbl" x="357" y="192" text-anchor="end">starts</text>
  <line class="edge" x1="415" y1="222" x2="415" y2="154" marker-end="url(#ar)"/>
  <text class="lbl" x="423" y="192">events</text>

  <!-- queue -> check; github -> copy -> check -->
  <line class="edge" x1="480" y1="253" x2="578" y2="253" marker-end="url(#ar)"/>
  <text class="lbl" x="529" y="245" text-anchor="middle">1. check</text>
  <line class="edge out" x1="850" y1="121" x2="762" y2="121" marker-end="url(#aro)"/>
  <text class="lbl edge-out" x="805" y="113" text-anchor="middle">git clone</text>
  <text class="lbl edge-out" x="805" y="141" text-anchor="middle">https only</text>
  <line class="edge" x1="670" y1="152" x2="670" y2="220" marker-end="url(#ar)"/>
  <text class="lbl" x="679" y="192">read only</text>

  <!-- check -> osv -->
  <line class="edge out" x1="760" y1="253" x2="848" y2="253" marker-end="url(#aro)"/>
  <text class="lbl edge-out" x="805" y="245" text-anchor="middle">versions</text>
  <text class="lbl edge-out" x="805" y="273" text-anchor="middle">if ticked</text>

  <!-- queue -> fix loop -->
  <line class="edge" x1="390" y1="284" x2="390" y2="352" marker-end="url(#ar)"/>
  <text class="lbl" x="399" y="324">2. fix what you tick</text>

  <!-- fix loop <-> local models -->
  <line class="edge" x1="480" y1="372" x2="578" y2="372" marker-end="url(#ar)"/>
  <text class="lbl" x="529" y="364" text-anchor="middle">prompt</text>
  <line class="edge" x1="580" y1="398" x2="482" y2="398" marker-end="url(#ar)"/>
  <text class="lbl" x="529" y="419" text-anchor="middle">streamed</text>

  <!-- fix loop -> sandbox -->
  <line class="edge" x1="390" y1="416" x2="390" y2="484" marker-end="url(#ar)"/>
  <text class="lbl" x="382" y="456" text-anchor="end">runs your tests</text>

  <!-- fix loop -> other models (hand-off) -->
  <polyline class="edge out" points="460,416 460,460 935,460 935,418" marker-end="url(#aro)"/>
  <text class="lbl edge-out" x="700" y="452" text-anchor="middle">hand-off, only after you see the preview</text>

  <!-- browser -> any AI chat, via the user -->
  <polyline class="edge out" points="120,152 120,595 935,595 935,550" marker-end="url(#aro)"/>
  <text class="lbl edge-out" x="525" y="587" text-anchor="middle">you copy the request, then paste its answer back</text>
</svg>
