[project]
name = "aeropatch"
version = "0.1.0"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "anthropic>=1.8.0",
    "bandit>=1.9.4",
    "docker>=7.2.0",
    "httpx>=0.28.1",
    "mcp>=2.2.0",
    "packaging>=24",
    "regexploit>=1.0.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.8",
]

[project.scripts]
aeropatch = "aeropatch.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/aeropatch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["docker: needs a running Docker daemon and the sandbox base image"]

[tool.ruff]
line-length = 120
extend-exclude = ["evaluations/scenarios", "tests/fixtures"]

[tool.ruff.lint.per-file-ignores]
# The runs notebook shows one laptop's local wall-clock times on purpose.
"notebooks/*.ipynb" = ["DTZ"]
